# Local Supabase config for DigiMark101.
# Apply supabase/migrations in filename order. Production uses the hosted project.

project_id = "digimark101"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://www.digimark101.com"
# Exact callback paths are required; an allowed origin alone does not allow its paths.
# This config is local. Mirror these entries in the hosted Auth URL Configuration.
additional_redirect_urls = [
  "https://avaskye.online",
  "https://www.digimark101.com/auth/callback",
  "https://www.digimark101.com/reset-password",
  "https://digimark101.com/auth/callback",
  "https://www.avaskye.online/auth/callback",
  "https://www.avaskye.online/reset-password",
  "https://avaskye.online/auth/callback",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/reset-password",
]

[functions.leads-collect]
verify_jwt = false

[functions.leads-qualify]
verify_jwt = false

[functions.leads-opt-out]
verify_jwt = false

[functions.paypal-webhook]
verify_jwt = false

[functions.platforms-provision]
verify_jwt = false

[functions.ava-memory]
verify_jwt = false
